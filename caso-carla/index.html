<style>
:root{
  /* Layout: una columna. Cine negro: mesa oscura, expedientes de papel manila, hilo rojo y latón */
  color-scheme: dark;
  --ink:#0d1222;        /* fondo */
  --ink-2:#1a2138;      /* paneles sobre el fondo */
  --line:#2f3a60;
  --mist:#b4bcd2;       /* texto sobre el fondo */
  --paper:#efe3c2;      /* hoja manila */
  --paper-2:#fbf5e2;
  --paper-edge:#d6c492;
  --type:#241f17;       /* texto sobre papel */
  --sepia:#6b5a31;
  --stamp:#b3261e;      /* sello, hilo rojo, errores */
  --brass:#d1a94c;      /* latón: candado, aciertos */
  --good:#2f6b3a;
  --display:"Special Elite","Courier New",Courier,monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ink);color:var(--mist);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%, #2a3562 0, rgba(13,18,34,0) 55%),radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.55) 0, rgba(0,0,0,0) 60%)}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .file{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.snd{background:none;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--mist);white-space:nowrap}

/* estado: pruebas archivadas */
.status{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.status .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.status .pill{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--stamp);text-transform:uppercase}
.status .pill.open{color:var(--brass)}
.ev{display:flex;gap:5px}
.ev i{flex:1;height:26px;border-radius:4px;border:1.5px solid #46527d;display:flex;align-items:center;justify-content:center;font:normal 13px var(--display);color:#5b6690}
.ev i.now{border-color:#8791b5;color:var(--mist)}
.ev i.on{border-color:var(--brass);background:#2a2412;color:var(--brass)}

/* portada y tarjetas de capitulo */
.card{background:linear-gradient(180deg,#141b33,#0b0f1d);border:1px solid var(--line);border-radius:8px;padding:26px 20px 22px;text-align:center;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.card .kick{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 8px;min-height:1.5em}
.card h2{font-family:var(--display);font-weight:400;color:#f4ecd6;font-size:30px;line-height:1.15;margin:0 0 8px;min-height:2.3em;text-wrap:balance}
.card h1{font-family:var(--display);font-weight:400;color:#f4ecd6;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:6px 0 4px;text-wrap:balance}
.card .where{font-size:15px;margin:0 0 14px}
.card .big-n{font-family:var(--display);font-size:92px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--brass);margin-bottom:2px}
.card svg{display:block;width:100%;height:auto;border-radius:6px;margin:6px 0 18px;border:1px solid var(--line)}
.card .brief{text-align:left;font-size:16px;margin:0 0 16px}
.card .brief p{margin:0 0 10px}
.card .brief strong{color:#f4ecd6}
.cstamp{display:inline-block;font-family:var(--display);font-size:15px;letter-spacing:.16em;color:var(--stamp);border:3px solid var(--stamp);padding:5px 12px 2px;border-radius:4px;transform:rotate(-7deg);text-transform:uppercase;margin:4px 0 12px}

/* hoja de expediente */
.sheet{background:var(--paper);color:var(--type);border-radius:5px;padding:22px 20px 24px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);
  background-image:radial-gradient(circle at 92% 97%, rgba(0,0,0,0) 0 34px, rgba(120,80,30,.16) 35px 39px, rgba(0,0,0,0) 40px),repeating-linear-gradient(transparent 0 31px, rgba(120,95,40,.10) 31px 32px)}
.scene{margin:-22px -20px 16px;border-bottom:3px solid var(--type);background:#0b0f1c}
.scene svg{display:block;width:100%;height:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.kick{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sepia);margin:0 0 4px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.sheet p{margin:0 0 12px}
.stamp{flex:none;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);padding:3px 8px 1px;border-radius:3px;transform:rotate(6deg);text-transform:uppercase;margin-top:2px}
.stamp.ok{color:var(--good);border-color:var(--good)}
.note{font-family:var(--display);font-size:16px;background:var(--paper-2);border-left:4px solid var(--paper-edge);padding:12px 14px;margin:14px 0;line-height:1.5}
.note.hand{font-family:var(--hand);font-size:23px;line-height:1.25;border-left:0;transform:rotate(-1deg);box-shadow:0 3px 8px rgba(0,0,0,.2)}
figure{margin:0}
.photo{margin:16px 6px;background:#fffaf0;padding:8px 8px 10px;box-shadow:0 4px 10px rgba(0,0,0,.3);transform:rotate(-1.5deg);position:relative}
.photo::before{content:"";position:absolute;top:-9px;left:50%;width:74px;height:20px;margin-left:-37px;background:rgba(214,196,146,.75);transform:rotate(2deg)}
.photo img{max-width:100%;display:block}
.photo figcaption{font-family:var(--hand);font-size:20px;color:var(--sepia);margin-top:4px}

/* pruebas */
.task{border-top:1.5px dashed #b9a56f;margin-top:18px;padding-top:16px}
.task .q{font-weight:600;margin:0 0 10px}
.task.done .q{font-weight:500}
.done-line{display:flex;gap:8px;align-items:flex-start;color:var(--good);font-weight:500;margin:6px 0 0}
.done-line::before{content:"✓";font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 180px;min-width:0;font:inherit;font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:11px 12px;border:2px solid #8f7c46;border-radius:6px;background:#fffaf0;color:var(--type)}
.btn{background:var(--type);color:#f6eed6;border:0;border-radius:6px;padding:12px 18px;font-weight:600}
.btn:disabled{opacity:.5}
.btn.big{width:100%;padding:15px 18px;font-size:18px;font-family:var(--display);font-weight:400;letter-spacing:.05em;background:linear-gradient(#e6c367,#c69a36);color:#231b06;box-shadow:0 4px 0 #86661c}
.btn.big:active{transform:translateY(3px);box-shadow:0 1px 0 #86661c}
.link{background:none;border:0;padding:6px 0;color:var(--sepia);text-decoration:underline;font-size:15px}
.msg{min-height:1.4em;margin:8px 0 0;font-size:15px;color:var(--stamp);font-weight:500}
.hint{background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:6px;padding:10px 12px;margin:8px 0 0;font-size:15px}
.hint b{font-family:var(--display);font-weight:400;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:#fffaf0;border:2px solid #8f7c46;border-radius:6px;padding:12px 14px;color:var(--type);font-weight:500;position:relative}
.opt.bad{border-color:var(--stamp);opacity:.75}
.opt-fb{font-size:15px;color:var(--stamp);margin:-2px 0 4px 4px}
.opt.lie{border-color:var(--stamp);padding-right:108px}
.opt.lie span{text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:2px}
.opt.lie::after{content:"¡mentira!";position:absolute;right:8px;top:50%;font-family:var(--hand);font-weight:700;font-size:22px;color:var(--stamp);transform:translateY(-50%) rotate(-8deg)}

/* ordenar */
.ord{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ord .it{display:flex;align-items:center;gap:8px;background:#fffaf0;border:2px solid #8f7c46;border-radius:6px;padding:8px 8px 8px 12px}
.ord .n{font-family:var(--display);color:var(--sepia);width:18px}
.ord .tx{flex:1;font-size:16px;line-height:1.35}
.ord .mv{width:42px;height:42px;border-radius:6px;border:1.5px solid #8f7c46;background:var(--paper);color:var(--type);font-size:16px}
.ord .mv:disabled{opacity:.3}

/* ruedas, caja fuerte y candado */
.wheels{display:flex;justify-content:center;gap:10px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel button{width:50px;height:36px;border-radius:6px;border:0;background:#4a5063;color:#f4ecd6;font-size:15px}
.wheel .v{width:50px;height:58px;border-radius:6px;background:#0c0f17;border:2px solid var(--brass);color:var(--brass);font-family:var(--display);font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 6px 8px rgba(0,0,0,.7),inset 0 -6px 8px rgba(0,0,0,.7)}
.safe{position:relative;margin-bottom:12px;perspective:900px}
.safe-in{position:absolute;inset:0;background:#07090f;border-radius:10px;display:flex;align-items:center;justify-content:center}
.safe-in div{background:var(--paper);color:var(--type);font-family:var(--display);font-size:14px;padding:16px 14px;transform:rotate(-4deg);box-shadow:0 4px 10px #000}
.safe-door{position:relative;border-radius:10px;padding:20px 12px 16px;border:4px solid #5c6378;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.1,.2,1);
  background:radial-gradient(circle at 12px 12px,#aab0c2 0 3px,rgba(0,0,0,0) 4px),radial-gradient(circle at calc(100% - 12px) 12px,#aab0c2 0 3px,rgba(0,0,0,0) 4px),radial-gradient(circle at 12px calc(100% - 12px),#aab0c2 0 3px,rgba(0,0,0,0) 4px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#aab0c2 0 3px,rgba(0,0,0,0) 4px),linear-gradient(135deg,#3b4152,#272b38 55%,#343a4b)}
.safe.open .safe-door{transform:rotateY(-78deg)}
.safe-plate{font-family:var(--display);font-size:11px;letter-spacing:.2em;color:#aab0c2;text-align:center;margin-bottom:12px}
.padlock{margin:4px auto 14px;width:min(100%,300px)}
.shackle{width:130px;height:84px;margin:0 auto -8px;border:16px solid #a3a9b8;border-bottom:0;border-radius:65px 65px 0 0;transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:88% 100%;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.padlock.open .shackle{transform:translateY(-20px) rotate(-22deg)}
.pbody{position:relative;background:linear-gradient(135deg,#e6c367,#b88a2a 60%,#d6ae4e);border-radius:14px;padding:18px 10px 16px;box-shadow:0 6px 0 #7b5c17,0 12px 18px rgba(0,0,0,.35)}

/* linterna */
.flash{position:relative;border-radius:6px;overflow:hidden;margin:0 0 6px;touch-action:none;cursor:crosshair;background:#0b1022}
.flash svg{display:block;width:100%;height:auto}
.flash .lit{position:absolute;inset:0}
.cap{font-size:14px;color:var(--sepia);margin:0 0 14px}

/* carta */
.menu{background:#fffaf0;border:1px solid var(--paper-edge);outline:1px solid var(--paper-edge);outline-offset:-7px;padding:22px 20px;margin:0 0 14px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.menu h3{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;margin:0;color:var(--stamp)}
.menu .sub{font-size:12px;color:var(--sepia);margin:4px 0 14px;letter-spacing:.14em;text-transform:uppercase}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.menu li{display:flex;gap:8px;align-items:baseline;font-size:16px}
.menu .dots{flex:1;border-bottom:1px dotted #b9a56f;transform:translateY(-4px)}
.menu .pr{font-variant-numeric:tabular-nums;color:var(--sepia)}

/* retrato robot */
.who{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.who .st{font-weight:500;margin-bottom:6px}
.who .ch{display:flex;gap:6px}
.who .ch button{flex:1;padding:10px 4px;border-radius:6px;border:2px solid #8f7c46;background:#fffaf0;color:var(--type);font-weight:500;font-size:15px}
.who .ch button.sel{background:var(--type);color:#f6eed6;border-color:var(--type)}
.who .w.bad .st{color:var(--stamp)}

/* interrogatorio */
.interr{background:#11162a;color:#e8e2cf;border-radius:6px;padding:12px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 4px 6px;border-radius:6px;border:2px solid #3a466f;background:#1a2138;color:#e8e2cf;font-size:13px;font-weight:600;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:44px;height:44px;display:block}
.tabs button.sel{border-color:var(--brass);background:#2a2412;color:var(--brass)}
.qa{display:flex;flex-direction:column;gap:6px}
.qa button{text-align:left;background:none;border:0;border-bottom:1px dashed #3a466f;padding:8px 0;color:#e8e2cf;font-weight:600;font-size:15px}
.qa .a{font-family:var(--display);font-size:15px;padding:4px 0 6px 12px;border-left:3px solid var(--brass);color:#f4ecd6}

/* documento ampliable */
.doc{margin:16px 2px 10px;background:#fffaf0;padding:6px 6px 4px;box-shadow:0 5px 14px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
.doc img{display:block;width:100%;height:auto;cursor:zoom-in}
.doc figcaption{font-size:13px;color:var(--sepia);text-align:center;padding-top:4px}
.zoomer{position:fixed;inset:0;z-index:20;background:rgba(5,7,14,.97);overflow:auto;-webkit-overflow-scrolling:touch}
.zoomer img{display:block;width:min(1000px,260vw);max-width:none;margin:0 auto}
.zoomer .btn{position:fixed;top:12px;right:12px;z-index:21;background:var(--brass);color:#231b06}

/* final */
.letter{font-family:var(--hand);font-size:25px;line-height:1.3;background:#fffaf0;padding:18px 18px 14px;margin:14px 2px;transform:rotate(-1deg);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.letter .sign{display:block;text-align:right;font-weight:700;font-size:28px;margin-top:6px}
.combo{display:flex;gap:10px;justify-content:center;margin:14px 0 18px}
.combo span{width:56px;height:70px;border-radius:8px;background:#2a2412;border:2px solid var(--brass);color:var(--brass);font-family:var(--display);font-size:40px;display:flex;align-items:center;justify-content:center}
.badge{display:flex;align-items:center;gap:14px;border:2px solid var(--good);border-radius:8px;padding:10px 14px;margin:14px 0}
.badge svg{width:64px;height:64px;flex:none}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:19px;color:var(--good);line-height:1.2}
.badge small{font-size:13px;color:var(--sepia)}
.foot{text-align:center;font-size:13px;color:#7f89a8}
.foot button{color:#7f89a8;font-size:13px}
.confirm{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;color:var(--mist)}
.confirm .row{justify-content:center;margin-top:8px}
.confirm .btn{background:var(--stamp);color:#fff;padding:9px 14px}
.confirm .btn.alt{background:var(--line)}
canvas#fx{position:fixed;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}

  .sheet.in,.card{animation:rise .45s ease-out both}
  @keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
  .slam{animation:slam .5s .15s cubic-bezier(.2,1.4,.4,1) both}
  .cstamp.slam{animation-delay:.9s}
  @keyframes slam{0%{transform:scale(3.4) rotate(-16deg);opacity:0}100%{opacity:1}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .ev i.new{animation:pop .7s ease-out}
  @keyframes pop{0%{transform:scale(1.9);box-shadow:0 0 18px var(--brass)}100%{transform:none;box-shadow:none}}
  .waves{animation:wave 3.2s linear infinite}
  .waves.slow{animation-duration:5.5s;animation-direction:reverse}
  @keyframes wave{to{transform:translateX(40px)}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.86,1.12)}60%{transform:scale(1.08,.9) skewX(5deg)}}
  .lamp{animation:swing 4.5s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  .qm{animation:bob 2.4s ease-in-out infinite}
  .qm.b{animation-delay:.8s}.qm.c{animation-delay:1.5s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .leg.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s .5s ease-in-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .qa .a{animation:rise .25s ease-out both}
  body.still *{animation:none!important;transition:none!important}
  body.still .leg.draw{stroke-dasharray:none;stroke-dashoffset:0}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="file">Expediente n.º 0301-21 · Brigada de Cumpleaños</div>
    <button class="snd" id="sndBtn" type="button">Sonido: sí</button>
  </header>

  <div class="status" id="status">
    <div class="lbl"><span id="evLbl"></span><span class="pill" id="lockPill"></span></div>
    <div class="ev" id="ev" aria-hidden="true"></div>
  </div>

  <main id="app"></main>

  <footer class="foot">
    <button class="link" id="motBtn" type="button">Animaciones: sí</button> · <button class="link" id="resetBtn" type="button">Reiniciar el caso</button>
    <div id="resetBox"></div>
  </footer>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN: lo que Jose puede querer cambiar está aquí arriba.
   ===================================================================== */
var CONFIG = {
  agente: "Carla",
  culpable: "Jose",
  combinacion: "3121",
  /* fotos: una imagen (data URI) por capítulo; si está vacío no se muestra nada */
  fotos: { 1:"", 2:"", 3:"", 4:"", 5:"", 6:"", 7:"" },
  pies:  { 1:"Tavernes", 2:"", 3:"Dénia", 4:"Saona", 5:"Valencia", 6:"", 7:"" },
  carta: "Carlita: confieso. Escondí tu regalo, le puse un candado y se me olvidó la combinación. Soy un despistado y un desastre, ya lo sabes. Pero hay una fecha que no se me olvida nunca: la del banquito. Feliz cumpleaños."
};

var CHAPTERS = [

function fireworks(ms){
  if (REDUCED) return;
  var cv=document.getElementById("fx"), ctx=cv.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2);
  var W=window.innerWidth, H=window.innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  var cols=["#d1a94c","#f4ecd6","#e0605a","#ffd98a","#9fb6ee"], ps=[], t0=Date.now(), last=0, run=++fxRun;
  function burst(){ var x=W*(.15+Math.random()*.7), y=H*(.1+Math.random()*.42), c=cols[Math.floor(Math.random()*cols.length)], n=52;
    for(var i=0;i<n;i++){ var a=Math.PI*2*i/n, v=1.6+Math.random()*3.6; ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:c}); }
    SFX.pop(); }
  (function loop(){
    if (run!==fxRun) return;
    var now=Date.now(); ctx.clearRect(0,0,W,H);
    if (now-t0<ms && now-last>560){ burst(); last=now; }
    ps=ps.filter(function(p){ return p.life>0; });
    ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.vy*=.985; p.life-=.013;
      ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,2.3,0,6.3); ctx.fill(); });
    ctx.globalAlpha=1;
    if (now-t0<ms || ps.length) requestAnimationFrame(loop); else ctx.clearRect(0,0,W,H);
  })();
}

/* ===================== controles ===================== */
document.getElementById("sndBtn").onclick=function(){ state.mute=!state.mute; save(); renderStatus();
  if (state.mute){ try{ if(silentEl) silentEl.pause(); }catch(e){} } else { unlockAudio(); SFX.ok(); } };
document.getElementById("motBtn").onclick=function(){ state.still=!state.still; REDUCED=!!state.still; document.body.classList.toggle("still",REDUCED); save(); renderStatus(); };
document.getElementById("resetBtn").onclick=function(){
  var box=document.getElementById("resetBox");
  if (box.firstChild){ box.innerHTML=""; return; }
  var c=el("div","confirm","¿Borrar el progreso y empezar el caso desde el principio?"), row=el("div","row");
  row.appendChild(btn("btn","Sí, reiniciar",function(){ state={step:0,task:0,hints:0,card:false,mute:state.mute,still:state.still}; lastDone=-1; fxRun++; save(); box.innerHTML=""; go(); }));
  row.appendChild(btn("btn alt","Cancelar",function(){ box.innerHTML=""; }));
  c.appendChild(row); box.appendChild(c);
};

app.addEventListener("click",function(e){
  var t=e.target; if(!t || !t.classList || !t.classList.contains("zoomable")) return;
  var z=el("div","zoomer"), im=el("img"); im.src=t.src; im.alt=t.alt;
  var close=btn("btn","Cerrar",function(){ z.remove(); });
  z.appendChild(close); z.appendChild(im); document.body.appendChild(z); SFX.tick();
  z.scrollLeft=Math.max(0,(im.offsetWidth-z.clientWidth)/2); close.focus();
});

var wl = null;
function keepAwake(){ try { if (navigator.wakeLock && !wl) navigator.wakeLock.request("screen").then(function(l){ wl=l; l.addEventListener("release",function(){ wl=null; }); }).catch(function(){}); } catch(e){} }
["touchend","click","keydown"].forEach(function(ev){ document.addEventListener(ev,function(){ unlockAudio(); if(state.step>0 && state.step<=N) keepAwake(); },true); });
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible" && state.step>0 && state.step<=N) keepAwake(); });
(function(){ var pre=new Image(); pre.src="img/retrato.jpg"; })();

render();
</script>
